<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reach out - SillyLittleTech</title>
    <script>
      /* ensure theme attribute is present early to avoid FOUC */ (function () {
        try {
          const t = localStorage.getItem("theme");
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch {
          /* localStorage may be unavailable */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap"
    />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://s.pageclip.co/v1/pageclip.css"
      media="screen"
    />
    <style>
      .apply-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .apply-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .apply-header h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }

      .apply-header p {
        font-size: 25px;
        opacity: 0.8;
      }

      .apply-form {
        background: var(--card-bg);
        border: 2px solid var(--border-color);
        border-radius: 12px;
        padding: 30px;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .form-group {
        margin-bottom: 20px;
      }

      .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        font-size: 25px;
      }

      .form-group input,
      .form-group textarea,
      .form-group select {
        width: 100%;
        padding: 12px 16px;
        background: var(--bg-color);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-color);
        font-family: inherit;
        font-size: 25px;
        transition: border-color 0.3s ease;
      }

      .form-group input:focus,
      .form-group textarea:focus,
      .form-group select:focus {
        outline: none;
        border-color: var(--accent-color);
      }

      .form-group textarea {
        min-height: 120px;
        resize: vertical;
      }

      .turnstile-container {
        margin: 20px 0;
        display: flex;
        justify-content: center;
      }

      .submit-button {
        width: 100%;
        padding: 14px 28px;
        background: var(--accent-color);
        border: none;
        border-radius: 8px;
        color: #ffffff;
        font-weight: 700;
        font-size: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 2px 8px var(--shadow);
      }

      .submit-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px var(--shadow);
        opacity: 0.9;
      }

      .submit-button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }
    </style>
  </head>
  <body>
    <!-- theme-toggle button is injected by theme.js -->
    <div class="apply-container">
      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="apply-header">
        <h1>Have a project idea?</h1>
        <p>Tell us about your project and we'll get back to you soon.</p>
      </div>

      <form
        action="https://sillylittle.workflows.okta.com/api/flo/0f22e3856fa49280c3f04502059e7ad6/invoke"
        class="apply-form pageclip-form"
        method="post"
      >
       <!-- <input type="hidden" name="access_key" value="bb1dbccf-9087-4eac-ae65-5e8f412c71df"> -->
        <div class="form-group">
          <label for="name">Name *</label>
          <input type="text" id="name" name="name" required />
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="project-name">Project Name *</label>
          <input type="text" id="project-name" name="project-name" required />
        </div>

        <div class="form-group">
          <label for="project-type">Project Type *</label>
          <select id="project-type" name="project-type" required>
            <option value="">Select a type...</option>
            <option value="personal">Personal Website</option>
            <option value="portfolio">Portfolio</option>
            <option value="blog">Blog</option>
            <option value="creative">Creative Project</option>
            <option value="educational">Educational Project</option>
            <option value="other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="description">Project Description *</label>
          <textarea
            id="description"
            name="description"
            placeholder="Tell us about your project, what you want to build, and any specific requirements..."
            required
          ></textarea>
        </div>

        <div class="turnstile-container">
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAB7RSihDlonez-YV"
            data-theme="auto"
          ></div>
        </div>

        <button type="submit" class="submit-button pageclip-form__submit">
          <span>Submit Application</span>
        </button>
      </form>
    </div>

   <!-- <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script> -->
      <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script> 
    <script src="theme.js"></script>
    <script src="script.js"></script>
  </body>
</html>
