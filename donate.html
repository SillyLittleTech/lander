<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Make a Donation - SillyLittleTech</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="site.css" />
    <style>
      .apply-container {
        max-width: 600px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      .apply-header {
        text-align: center;
        margin-bottom: 40px;
      }

      .apply-header h1 {
        font-size: 32px;
        margin-bottom: 16px;
      }

      .apply-header p {
        font-size: 25px;
        opacity: 0.8;
      }

      .back-link {
        display: inline-block;
        margin-bottom: 30px;
        color: var(--accent-color);
        text-decoration: none;
        font-weight: 500;
      }

      .back-link:hover {
        text-decoration: underline;
      }

    </style>
  </head>
  <body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
      <svg
        class="sun-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <svg
        class="moon-icon"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>

    <div class="apply-container">
      <a href="index.html" class="back-link">← Back to Home</a>

      <div class="apply-header">
        <h1>Make a Donation</h1>
        <p>Fill out the donation form, and it will be greatly appreciated.</p>
        <a href="https://share.sillylittle.tech/donate" class="contact-button"
          >↗</a
        >
        <img
          src="https://graph.hcb.hackclub.com/sillylittletech"
          alt="Donor graph for SillyLittleTech"
        />
      </div>
      <iframe
        src="https://hcb.hackclub.com/donations/start/sillylittletech"
        style="border: none"
        name="donateFrame"
        scrolling="yes"
        frameborder="0"
        marginheight="0px"
        marginwidth="0px"
        height="512px"
        width="512px"
        allowfullscreen
      ></iframe>
    </div>

    <script src="https://s.pageclip.co/v1/pageclip.js" charset="utf-8"></script>
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <script src="theme.js"></script>
    <script src="script.js"></script>
  </body>
</html>
